[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontorepo-fleet"
version = "1.0.0"
description = "Dépôt piloté par l'ontologie : garde-fous SHACL pour LLM, mémoire PROV-O, DDD et TDD — cas d'usage supervision d'une flotte de PC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.0", "pyshacl>=0.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
onto = "ontorepo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
